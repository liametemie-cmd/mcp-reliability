name: Weekly snapshot
on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name "faceabot-open-data"
          git config user.email "faceabot-open-data@users.noreply.github.com"
          git add data README.md
          git diff --cached --quiet || git commit -m "Weekly snapshot $(date -u +%G-W%V)"
          git push
